# Copy to models.yaml (gitignored) and fill in. ${VAR} is replaced from the environment.
# Prices are USD per million tokens. Ollama models cost 0.
#
# If `litellm` is set, every model is called through that proxy instead of its own
# apiBaseUrl (the `model` name is then the LiteLLM model name), and the cost comes
# from the proxy's x-litellm-response-cost header when it is present.
litellm:
  baseUrl: ""            # e.g. http://localhost:4000/v1 ; leave empty to call endpoints directly
  apiKeyEnv: LITELLM_API_KEY

models:
  qwen3.8-local:
    apiBaseUrl: ${OLLAMA_URL}/v1
    model: qwen3.8-27b-ctx96k
    price: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
    params: { temperature: 0.6 }

  sonnet-openrouter:
    apiBaseUrl: https://openrouter.ai/api/v1
    apiKeyEnv: OPENROUTER_API_KEY
    model: anthropic/claude-sonnet-5.5   # check the exact id on your gateway
    price: { input: 3, output: 15, cacheRead: 0.3, cacheWrite: 3.75 }
    params: { temperature: 0.2 }
