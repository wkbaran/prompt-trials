# Synthetic examples: every name and post is invented. Real cases built from your own recordings
# go in cases.private.yaml (gitignored) and point at fixtures/ (also ignored).
- description: after the first read batch, keeps reading instead of finishing (2026-10-07 bug)
  vars: { fixture: suites/medium-digest/examples/after-first-batch.json }
  assert:
    - { type: javascript, value: "file://../../src/assertions.ts:avoidsTool", config: { names: [digest_finish] } }
    - { type: javascript, value: "file://../../src/assertions.ts:callsTool", config: { names: [read_post, delegate_task] } }

- description: final reply starts with the digest header
  vars: { fixture: suites/medium-digest/examples/final-reply.json }
  assert:
    - { type: javascript, value: "file://../../src/assertions.ts:startsWith", config: { pattern: "(?:#+ |\\*\\*)?Medium" , flags: i } }

- description: delegation passes only the listed refs, unchanged
  vars: { fixture: suites/medium-digest/examples/before-delegation.json }
  assert:
    - { type: javascript, value: "file://../../src/assertions.ts:delegatedRefsPreserved" }
