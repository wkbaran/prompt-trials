description: smoke test of the custom provider and shared assertions
prompts:
  - "{{fixture}}"
providers:
  - id: file://../../src/provider.ts
    label: qwen3.8-local
    config: { model: qwen3.8-local }
tests:
  - description: calls get_weather with a city
    vars: { fixture: suites/smoke/cases/weather.json }
    assert:
      - type: javascript
        value: file://../../src/assertions.ts:callsTool
        config: { names: [get_weather] }
      - type: javascript
        value: file://../../src/assertions.ts:validToolArguments
      - type: javascript
        value: file://../../src/assertions.ts:avoidsTool
        config: { names: [delete_everything] }
